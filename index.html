<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои оценки в Moodle</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f8ff;
            --card-bg: #ffffff;
            --text-main: #1e3a8a;
            --text-muted: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #e0f2fe;
            --shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { 
            background: linear-gradient(135deg, #e0f2fe 0%, #f3e8ff 100%);
            color: var(--text-main); 
            padding: 2rem 1rem; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 800px; }
        
        /* Форма входа */
        .login-card { 
            background: var(--card-bg); 
            padding: 2.5rem; 
            border-radius: 24px; 
            box-shadow: var(--shadow); 
            margin-bottom: 2rem; 
            border: 1px solid var(--border);
        }
        .login-card h1 { 
            font-size: 2rem; 
            margin-bottom: 0.5rem; 
            color: var(--primary); 
            text-align: center;
            font-weight: 800;
        }
        .login-card p { color: var(--text-muted); margin-bottom: 1.5rem; text-align: center; font-weight: 600; }
        .input-group { margin-bottom: 1.2rem; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-main); }
        .input-group input { 
            width: 100%; 
            padding: 0.8rem 1rem; 
            border: 2px solid var(--border); 
            border-radius: 12px; 
            font-size: 1rem; 
            background: #f8fafc;
            transition: all 0.2s; 
        }
        .input-group input:focus { outline: none; border-color: var(--primary); background: #fff; }
        
        .btn { 
            display: inline-block; 
            width: 100%; 
            padding: 1rem; 
            background: linear-gradient(to right, #3b82f6, #06b6d4); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 1.1rem; 
            font-weight: 800; 
            cursor: pointer; 
            transition: transform 0.1s, box-shadow 0.2s; 
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        
        /* Результаты */
        .results { display: none; }
        .results.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Плашка со статистикой */
        .stats-banner {
            background: linear-gradient(to right, #3b82f6, #2563eb);
            color: white;
            padding: 1.2rem 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
        }
        .stats-banner h2 { font-size: 1.1rem; font-weight: 700; margin: 0; }
        .stats-count {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1.2rem;
        }
        
        .course-card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            margin-bottom: 1.5rem; 
            box-shadow: var(--shadow); 
            overflow: hidden; 
            border: 1px solid var(--border);
        }
        .course-header { 
            background: linear-gradient(to right, #e0f2fe, #f3e8ff); 
            padding: 1.2rem 1.5rem; 
            border-bottom: 1px solid var(--border); 
            font-weight: 800; 
            font-size: 1.1rem; 
            color: var(--primary); 
        }
        
        .grade-table { width: 100%; border-collapse: collapse; }
        .grade-table th, .grade-table td { padding: 1rem 1.5rem; text-align: left; border-bottom: 1px solid var(--border); }
        .grade-table th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 800; background: #f8fafc; }
        .grade-table tr:last-child td { border-bottom: none; }
        .grade-table tr:hover { background-color: #f0f9ff; }
        .grade-table td { font-size: 0.95rem; font-weight: 600; }
        .grade-value { font-weight: 800; color: var(--primary); font-size: 1.1rem; }
        .grade-range { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; }
        
        .empty-state { text-align: center; padding: 3rem; background: var(--card-bg); border-radius: 20px; color: var(--text-muted); border: 2px dashed var(--border); font-weight: 700; }
        .error-msg { background: #fff1f2; color: #e11d48; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; border: 1px solid #fecdd3; display: none; font-weight: 700; text-align: center; }
        .loading { text-align: center; padding: 2rem; color: var(--primary); font-weight: 800; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h1>🎓 Мои оценки</h1>
            <p>Введите данные от Moodle, чтобы увидеть успеваемость.</p>
            
            <div id="errorBox" class="error-msg"></div>

            <div class="input-group">
                <label for="moodleUrl">Адрес Moodle</label>
                <input type="url" id="moodleUrl" placeholder="https://node-server.ru/m" value="https://node-server.ru/m">
            </div>
            <div class="input-group">
                <label for="username">Логин</label>
                <input type="text" id="username" placeholder="Ваш логин">
            </div>
            <div class="input-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn" id="loginBtn" onclick="fetchGrades()">Войти 🚀</button>
        </div>

        <div id="loading" class="loading" style="display: none;">Загружаем данные... ⏳</div>

        <div id="results" class="results">
            <!-- Сюда будут вставляться статистика и карточки курсов -->
        </div>
    </div>

    <script>
        async function fetchGrades() {
            const urlInput = document.getElementById('moodleUrl').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');
            const btn = document.getElementById('loginBtn');

            errorBox.style.display = 'none';
            resultsDiv.innerHTML = '';
            resultsDiv.classList.remove('active');
            
            if (!urlInput || !username || !password) {
                showError('Пожалуйста, заполните все поля ✍️');
                return;
            }

            const baseUrl = urlInput.endsWith('/') ? urlInput.slice(0, -1) : urlInput;

            btn.disabled = true;
            loadingDiv.style.display = 'block';

            try {
                // 1. Получаем токен
                const tokenResponse = await fetch(`${baseUrl}/login/token.php?service=moodle_mobile_app`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ username, password })
                });
                
                const tokenData = await tokenResponse.json();

                if (tokenData.error) throw new Error(`Ошибка: ${tokenData.error}`);
                if (!tokenData.token) throw new Error('Не удалось получить токен. Проверьте логин/пароль.');

                const token = tokenData.token;

                // 2. Получаем ID пользователя
                const siteInfoResponse = await fetch(`${baseUrl}/webservice/rest/server.php?moodlewsrestformat=json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ wstoken: token, wsfunction: 'core_webservice_get_site_info' })
                });
                const siteInfo = await siteInfoResponse.json();
                
                if (!siteInfo.userid) throw new Error('Не удалось получить ID пользователя.');

                // 3. Получаем ВСЕ курсы пользователя
                const coursesResponse = await fetch(`${baseUrl}/webservice/rest/server.php?moodlewsrestformat=json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ wstoken: token, wsfunction: 'core_enrol_get_users_courses', userid: siteInfo.userid })
                });
                const courses = await coursesResponse.json();

                if (!Array.isArray(courses) || courses.length === 0) {
                    resultsDiv.innerHTML = '<div class="empty-state">Вы не записаны ни на один курс. 😢</div>';
                    resultsDiv.classList.add('active');
                    return;
                }

                // === ДОБАВЛЯЕМ ПЛАШКУ СТАТИСТИКИ ===
                resultsDiv.innerHTML += `
                    <div class="stats-banner">
                        <h2>Всего найдено курсов:</h2>
                        <div class="stats-count">${courses.length}</div>
                    </div>
                `;

                // 4. Проходимся по каждому курсу и запрашиваем ТОЛЬКО ЕГО ОЦЕНКИ
                for (const course of courses) {
                    const gradesResponse = await fetch(`${baseUrl}/webservice/rest/server.php?moodlewsrestformat=json`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ 
                            wstoken: token, 
                            wsfunction: 'gradereport_user_get_grade_items', 
                            courseid: course.id,
                            userid: siteInfo.userid // <--- ВАЖНО: указываем, чьи именно оценки нужны
                        })
                    });
                    const gradeData = await gradesResponse.json();
                    
                    renderCourseCard(course, gradeData);
                }

                resultsDiv.classList.add('active');

            } catch (err) {
                showError(err.message);
            } finally {
                btn.disabled = false;
                loadingDiv.style.display = 'none';
            }
        }

        function renderCourseCard(course, gradeData) {
            const resultsDiv = document.getElementById('results');
            
            let html = `<div class="course-card">
                <div class="course-header">📚 ${course.fullname}</div>`;
            
            if (gradeData && gradeData.usergrades && gradeData.usergrades[0] && gradeData.usergrades[0].gradeitems) {
                const items = gradeData.usergrades[0].gradeitems;
                
                if (items.length > 0) {
                    html += `<table class="grade-table">
                        <thead>
                            <tr>
                                <th>Задание</th>
                                <th>Оценка</th>
                                <th>Диапазон</th>
                            </tr>
                        </thead>
                        <tbody>`;
                    
                    items.forEach(item => {
                        const grade = item.graderaw !== null ? item.graderaw : '-';
                        const range = item.grademax !== null ? `0-${item.grademax}` : '-';
                        const name = item.itemname ? item.itemname.trim() : 'Без названия';
                        
                        html += `<tr>
                            <td>${name}</td>
                            <td class="grade-value">${grade}</td>
                            <td class="grade-range">${range}</td>
                        </tr>`;
                    });
                    
                    html += `</tbody></table>`;
                } else {
                    html += `<div style="padding: 1.5rem; color: #64748b; font-size: 0.9rem; text-align: center;">В этом курсе нет заданий для оценивания.</div>`;
                }
            } else {
                html += `<div style="padding: 1.5rem; color: #64748b; font-size: 0.9rem; text-align: center;">Нет данных об оценках для этого курса.</div>`;
            }
            
            html += `</div>`;
            resultsDiv.innerHTML += html;
        }

        function showError(msg) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }
    </script>
</body>
</html>
